name: Deploy Doctor Haytham site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Pages repository
        uses: actions/checkout@v6

      - name: Prepare site from production repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          git clone --depth 1 https://github.com/merelutfe-star/doctor-haytham-pharmacies.git site
          rm -rf site/.git
          grep -rl --exclude-dir=.git "https://doctor-haytham-pharmacies.vercel.app" site | xargs -r sed -i 's#https://doctor-haytham-pharmacies.vercel.app#https://merelutfe-star.github.io#g'
          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Doctor Haytham site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: doctor-haytham-pages
          path: site

      - name: Deploy Doctor Haytham site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: doctor-haytham-pages

# Trigger deployment after source-site content update
